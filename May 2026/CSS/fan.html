<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            margin: 0px auto;
            width: 400px;
            height: 95vh;
            border:2px solid black;
        }
        .fan-box{
            margin: 50px auto;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border:1px solid wheat;
        }
        .main:hover .fan-box{
            animation: anim .3s linear infinite;

        }
        .circle{
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: wheat;
            transform: translate(130px,130px);
        }
        .p{
            background-color: wheat;
            width: 135px;
            height: 30px;
            border-radius: 50%;
        }
        .p1{
            /* background-color: green; */
            transform: translate(0,93px);
        }
        .p2{
            /* background-color: blue; */
            transform: rotate(90deg) translate(-18px,-83px);

        }
        .p3{
            /* background-color: yellow; */
            transform: rotate(90deg) translate(118px,-83px);
        }
        .p4{
            /* background-color: aquamarine; */
            transform: translate(166px,3px);
        }
        .stick{
            margin: 0 auto;
            width: 30px;
            height: 420px;
            background-color: black;
            transform: translate(0,-185px);
            position: relative;
            z-index: -1;
        }
        .stand{
            margin: 0 auto;
            width: 200px;
            height: 50px;
            background-color: black;
            transform: translate(0,-200px);
            border-radius: 50% 50% 0 0;
        }

        @keyframes anim {
            100%{
                transform: rotate(360deg);
            }
            
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="fan-box">
            <div class="circle"></div>
            <div class="p p1"></div>
            <div class="p p2"></div>
            <div class="p p3"></div>
            <div class="p p4"></div>
        </div>
        <div class="stick"></div>
        <div class="stand"></div>
    </div>
</body>
</html>
