<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            margin: 50px auto;
            width: 90%;
            height: 90vh;
            border: 2px solid black;
            padding: 10px 160px;
        }
        .fan-header{
            width:300px;
            height: 300px;
            border:2px solid rgba(218, 218, 218, 0.515);
            border-radius: 50%;
            position: relative;
            z-index: 2;
            /* animation:anim .5s linear infinite; */
            
        }
        .container:hover .fan-header{
            animation:anim .3s linear infinite;
        }
        .fan-header .circle{
            margin: 140px auto;
            width: 20px;
            height: 20px;
            background-color: red;
            border-radius: 50px;
        }
        .fan-header .p1{
            width: 140px;
            height: 40px;
            background-color: red;
            border-radius: 50%;
            transform: translate(0,-170px);
        }
        .fan-header .p2{
            width: 140px;
            height: 40px;
            background-color: red;
            border-radius: 50%;
            transform: translate(158px,-210px);
        }
        .fan-header .p3{
            width: 140px;
            height: 40px;
            background-color: red;
            border-radius: 50%;
            transform: translate(79px,-330px) rotate(90deg);
        }
        .fan-header .p4{
            width: 140px;
            height: 40px;
            background-color: red;
            border-radius: 50%;
            transform: translate(79px,-210px) rotate(90deg);
        }
        .fan-pipe{
                width: 40px;
                height: 400px;
                background-color: black;
                border-radius: 50% 50% 0 0;
                transform: translate(131px,-158px);
        }
        .fan-stand{
            width: 200px;
            height: 60px;
            background-color: rgb(0, 0, 0);
            transform: translate(54px,-160px);
            border-radius: 50% 50% 0 0;
        }

        @keyframes anim{
            
            100%{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="fan-header">
            <div class="circle"></div>
            <div class="p1"></div>
            <div class="p2"></div>
            <div class="p3"></div>
            <div class="p4"></div>
        </div>
        <div class="fan-pipe">
        </div>
        <div class="fan-stand"></div>
    </div>
</body>
</html>
