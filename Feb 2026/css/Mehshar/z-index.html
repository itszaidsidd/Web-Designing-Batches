<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width: 80vw;
            height: 80vh;
            margin: 100px auto;
            border:2px solid black;
        }
        .box{
            width: 200px;
            height: 200px;
            border:2px solid teal;
            color:white;
            position: relative;
        }
        .box1{
            background: red;
            top:70px;
            left: 50px;
            z-index: 2;
        }
        .box2{
            background-color: green;
            left:100px;
            top:-70px;
            z-index: 0;
        }
        .box3{
            background-color: blue;
            left:150px;
            top:-200px;
            z-index:1;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box box1">Div1</div>
        <div class="box box2">Div2</div>
        <div class="box box3">Div3</div>
    </div>
</body>
</html>
