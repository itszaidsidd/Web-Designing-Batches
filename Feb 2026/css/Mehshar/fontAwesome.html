<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        nav{
            display: inline-block;
            width: 200px;
            height: 100vh;
            background-color: darkblue;
            padding: 20px;
            color:white;
        }
        ul{
            display: flex;
            flex-direction: column;
            gap:10px;
        }
        ul li{
            list-style: none;
            padding: 10px;
            border-radius: 5px;
        }
        ul li:hover{
            background-color: rgba(159, 188, 255, 0.37);
            cursor: pointer;
        }
        main{
           
            display: inline-block;
        }
        main .circle{
            width: 150px;
            height: 150px;
            /* border:2px solid green; */
            background-image: url("images/n3.jpg");
            background-size: cover;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><i class="fa-solid fa-gauge"></i> DashBaord</li>
            <li><i class="fa-solid fa-book"></i> Courses</li>
            <li><i class="fa-brands fa-amazon-pay"></i> Payment</li>
            <li><i class="fa-solid fa-chart-line"></i> Report</li>
            <li><i class="fa-solid fa-key"></i> Change Password</li>
        </ul>
    </nav>
    <main>
        <div class="circle">
asd
        </div>
    </main>
</body>
</html>
