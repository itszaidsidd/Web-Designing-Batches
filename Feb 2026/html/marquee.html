<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <marquee bgcolor="red"  scrolldelay="1000">This is marquee tag</marquee>
    <marquee direction="right" bgcolor="green">This is marquee tag direction right</marquee>
    <marquee direction="up" height="40px" bgcolor="blue">This is marquee tag direction up</marquee>
    <marquee behavior="scroll" scrollamount="50">Marquee begavior scroll</marquee>
    <marquee behavior="slide" scrollamount="50">Marquee begavior slide</marquee>
    <marquee behavior="alternate" scrollamount="50">Marquee begavior alternate</marquee>
    <marquee loop=5 scrollamount="40" bgcolor="yellow">Maruquee loop 5</marquee>
    <marquee hspace="400px" bgcolor="khaki">Marquee hspace </marquee>
    
</body>
</html>
