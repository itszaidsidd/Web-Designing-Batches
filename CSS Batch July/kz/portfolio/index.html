<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <ul>
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- About Section -->
    <section id="about">
        <img src="images/profile.jpg" alt="My Photo" />
        <h1>Hi, I'm Zaid!</h1>
        <p>I am a passionate developer learning web technologies...</p>
    </section>

    <!-- Skills Section -->
    <section id="skills">
        <h2>Skills</h2>
        <div class="skill">
            <p>HTML</p>
            <div class="bar"><div style="width:90%"></div></div>
        </div>
        <div class="skill">
            <p>CSS</p>
            <div class="bar"><div style="width:85%"></div></div>
        </div>
        <div class="skill">
            <p>JavaScript</p>
            <div class="bar"><div style="width:70%"></div></div>
        </div>
    </section>

    <!-- Projects Section -->
    <section id="projects">
        <h2>Projects</h2>
        <div class="project">
            <img src="images/project1.png" alt="Project 1"/>
            <h3>Project Title</h3>
            <p>Description of the project.</p>
            <a href="#">View</a>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact">
        <h2>Contact Me</h2>
        <form onsubmit="submitForm(event)">
            <input type="text" placeholder="Name" required />
            <input type="email" placeholder="Email" required />
            <textarea placeholder="Message" required></textarea>
            <button type="submit">Send</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 Zaid. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
