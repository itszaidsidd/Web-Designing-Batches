<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>note talking box</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color:rgb(39, 38, 38);
            cursor: pointer;
        }
         .main{
            margin:auto;
            margin-top:150px;
             width:980px;
             height:690px;
             background-color:rgb(154, 208, 255);
             padding:20px;
             border-radius: 30px;
            box-shadow:-5px,-5px,10px( red,green,blue,pink,orange,purple);
         }
        p{
            font-size: 37px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bolder;
            color:black;
            text-align: center;
            margin:auto;
        }
        .add{
            /* height:40px; */
            /* width:150px; */
            padding:10px;
            border:none;
            color :white;
            cursor: pointer;
            border-radius: 12px;
            font-size: 25px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bolder;
            color:white;
            background:black;
        }
        input{
             width:910px;
             height:470px;
             border-radius: 30px;
             font-size: 30px;
             color: black;
             font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
             font-weight: bolder;
             border: none;
             text-align:inherit;
             padding:20px;
              background: linear-gradient(rgba(245, 17, 245, 0.733),rgb(226, 123, 140));
              display:

        }
        button:hover{
             background: linear-gradient(rgba(245, 17, 245, 0.733),rgb(226, 123, 140));


        }
        #close{
            width: 40px;
            height: 40px;
        }
        .note{
            width: 90%;
            /* height: 500px; */
            background-color: white;
            padding: 10px;
            display: none;

        }
        #area{
            margin-top: 10px;
            width: 100%;
            height: 450px;
            font-size:24px;
            background-color: bisque;   
        }
        .abc{
            display: block;
            /* background-color: red;; */
        }
    </style>
</head>
<body>
    <div class="main" id="main">
        <P><u>talking note box !</u></P>
        <button onclick="btn()" class="add">+ ADD ON </button><br><br>
        <div id="note" class="note">
            <button id="close" onclick="btn2()">❌</button><br>
            <textarea name="" id="area"></textarea>
        </div>
        </div>
    </div>
    <script>
        function btn(){
            let t= document.getElementById('note');
            t.classList.add('abc');

        }
        function btn2(){
            let t=document.getElementById('note');
            console.log(t);
            t.classList.remove('abc');
        }

    </script>
</body>
</html>
