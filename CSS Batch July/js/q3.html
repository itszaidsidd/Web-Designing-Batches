<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            margin: 50px auto;
            border:5px solid black;
            width: 300px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <label for="salary">Enter Salary</label>
        <input type="number" id="salary"><br><br>
        <input type="checkbox" name="" id="hra">
        <label for="hra">HRA 20%</label><br><br>
        <input type="checkbox" name="" id="da">
        <label for="da">DA 10%</label><br><br>
        <input type="checkbox" name="" id="ta">
        <label for="ta">TA 5%</label><br><br>
        <button onclick="ok()">OK</button>
        <hr>
        HRA <input type="number" id="hra1"> <br><br>
        DA <input type="number" id="da1"> <br><br>
        TA <input type="number" id="ta1"> <br><br>
        Gross Salary <input type="number" id="gs"> 

    </div>
    <script>
        function ok(){
            let salary=document.getElementById('salary').value;
            let hra=document.getElementById('hra').checked;
            let da=document.getElementById('da').checked;
            let ta=document.getElementById('ta').checked;

            let hra1=document.getElementById("hra1");
            let da1=document.getElementById("da1");
            let ta1=document.getElementById("ta1");
            let gs=document.getElementById("gs");

            let h=0;
            let d=0;
            let t=0;

            if(hra==true){
                h=salary*20/100;
            }
            if(da==true){
                d=salary*10/100;
            }
            if(ta==true){
                t=salary*5/100;
            }
            let sal=parseInt(salary);
            let grossSalary=sal+h+d+t;

            hra1.value=h;
            da1.value=d;
            ta1.value=t;
            gs.value=grossSalary;

        }
    </script>
</body>
</html>
