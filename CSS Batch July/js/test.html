<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,td{
            border:1px solid rgb(125, 248, 125);
            background-color: rgb(229, 250, 229);
            border-collapse: collapse;
        }
        td{
            padding: 10px 20px;
            font-size:2em;
        }
    </style>
</head>

<body>
    <table>
    <script>
        let n = prompt("enter a number")
        let i = 1;
        while (i <= 10) {
            // document.write(n+" * "+i+" = "+i * n + "<br>")
            document.write("<tr><td>"+n+"</td><td>*</td><td>"+i+"</td><td>=</td><td>"+i*n+"</td></tr>")
            i++
        }
    </script>
    </table>
</body>

</html>
