<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            background-image: linear-gradient(170deg, aquamarine, rgb(17, 162, 114));
        }
        .container {
            margin: 50px auto;
            width: 400px;
            background-image: linear-gradient(170deg, aquamarine, rgb(17, 162, 114));
            padding: 20px;
            box-shadow: -1px -1px 10px rgb(32, 209, 150);
            color: aquamarine;
        }

        .main {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 20px;
            display: flex;
            flex-direction: column;
            /* justify-content: center; */
            text-align: center;
            gap: 20px;
        }

        .logo img {
            width: 65px;
        }

        .title {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.3em;

        }

        .user-name,
        .pass {
            width: 100%;
            /* background-color: red; */
            padding: 3px 0;
            border-bottom: 1px solid aquamarine;
        }
        #pass,
        #username {
            padding: 7px 10px;
            width: 90%;
            margin-left: 10px;
            /* color:aquamarine; */
            background-color: transparent;
            border: transparent;
            outline: none;
        }

        input::placeholder {
            color: aquamarine;
        }

        button {
            padding: 9px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
        }

        input:focus,input{
            /* border: transparent; */
            outline: none;
            color: aquamarine;
            /* font-size: 1.1em; */
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="main">
            <div class="logo">
                <img src="https://cdn-icons-png.flaticon.com/512/6681/6681204.png">
            </div>
            <p class="title">USER LOGIN</p>
            <div class="user-name">
                <i class="fa-solid fa-user"></i>
                <input type="text" name="" id="username" placeholder="Username/ Email">
            </div>
            <div class="pass">
                <i class="fa-solid fa-lock" id="show"></i>
                <input type="password" name="" id="pass" placeholder="Password">
            </div>
            <button>LOGIN</button>
        </div>
    </div>
    <script>
        let x = document.getElementById('show');
        x.addEventListener('click', function () {
            let p = document.getElementById('pass');
            if (p.type == 'password') {
                p.type = 'text';
                x.classList.remove('fa-lock');
                x.classList.add('fa-lock-open');
            }
            else{
                p.type='password';
                x.classList.remove('fa-lock-open');
                x.classList.add('fa-lock');
            }

        })
    </script>
</body>

</html>
