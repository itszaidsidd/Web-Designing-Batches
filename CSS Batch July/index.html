<html>
	<head>
	<style>
		div{
			width:600px;
			margin:200px auto;
			padding:20px;
			border:10px solid blue;
			border-radius:50px 0 20px 10px;
			
		}
		h1{
			border-left:50px solid red;
			padding-left:10px;
			border-right:80px solid green;
		}
		p{
			border-left:20px solid red;
			padding-left:10px;
		}
	</style>
	</head>
	<body>
		<div>
			<h1>CSS Box Model</h1>
			<p>In the world of WWW (world wide web) it is believed
				that each HTML Element is a Box And each Element
				means Box has its own different properties. Box
				Model is designed in CSS to understand these
				properties. And Box Model plays an important role in
				Web Designing.</p>
		</div>
	</body>
</html>
