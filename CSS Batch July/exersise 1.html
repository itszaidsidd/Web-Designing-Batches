<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .nav{
            background-color: rgb(0, 64, 255);
           // padding:4px;
        }
        li{
            list-style: none;
            display: inline-block;
            color:white;
            //background-color: rgb(255, 242, 2);
            padding: 10px;
            margin-left :50px;
            width:100px;
            font-weight: 400;
            font-size: 18px;
            font-family: arial;
            text-align: center ;
            border-radius: 10px;
        }
        li:hover{
            background-color: skyblue;
            color:blue;
        }
        img{
            width:100px;
            
        }
        .main{
            width:100vw;
            background-color: lightgray;
            //padding-top:50px;
        }
        .box1,.box2{
            width:38%;
            height:500px;
            background-color: red;
            display: inline-block;
            margin:50px 5%;

        }
        .box2{
            background-color:rgb(71, 228, 71);
        }
        .kuch_bhi{
            width:80vw;
            background-color: antiquewhite;
            font-size:3em;
            font-family: jokerman;
            color:rgb(248, 141, 1);
            border: 5px solid rgb(248, 141, 1);
            border-radius: 25px;
            margin:10px auto;
            text-align: center;

        }
        .circle{
            width:50px;
            height:50px;
            background-color: black;
            border-radius: 50%;
            position: fixed;
            right:40px;
            bottom:30px;
        }
        .circle:hover{
            background-color: green;
        }
        .footer{
            width:100%;
            padding:10px 0;
            background-color: rgb(11, 85, 85);
            color:white;
            font-size: 2em;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="nav">
            <ul>
                <li><img src="images/logo.png" alt=""></li>
                <li>Home</li>
                <li>About us</li>
                <li>Login</li>
                <li>Contact us</li>
            </ul>
        </div>
    </div>
    <div class="main">
        <div class="box1">
            This box 1
        </div>
        <div class="box2">
            This is box 2
        </div>
    </div>
    <div class="kuch_bhi">
        Welcome to my Website
    </div>
    <div class="circle">

    </div>
    <div class="footer">
        &copy 2025 Developed by ACE
    </div>
</body>
</html>
