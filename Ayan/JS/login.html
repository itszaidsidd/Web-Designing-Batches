<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box{
        border: 5px double black;
        background-color: bisque;
        padding: 30px;
        align-items: center;
        width: 300px;
        margin: 10px auto;
        font-weight: bold;
        font-size: 30px;
        box-shadow: 10px 5px 10px rgb(72, 67, 67); 
    }
    input{
        height: 20px;
        width: 250px;
        box-shadow: 10px 3px 10px rgb(72, 67, 67);
        border-radius: 10px;
    }
    button{
        width: 150px;
        height: 30px;
        font-weight: bold;
        font-size: 20px;
        box-shadow: 10px 5px 10px rgb(84, 84, 7)
    }
    .title{
        font-weight: bold;
        text-align: center;
        font-size: 40px;
        margin-top: 150px;
    }
    body{
        background-color: rgb(142, 220, 220);
    }
    .loader{
        border: 19px solid rgb(68, 147, 211);
        border-top: 19px solid rgb(22, 80, 167);
        width: 200px;
        height: 200px;
        border-radius: 50%;
        /* margin-top: -300px;
        margin-left: 730px; */
        margin: -300px auto;
        position: relative;
        animation: loader 1s linear infinite;
        display: none;
    }
    @keyframes loader{
        100%{
            transform: rotate(360deg);
        }
    }
    .alert{
          border: 3px solid green;
          background-color: green;
          color: white;
          width: 400px;
          height: 300px;
          padding: 10px;
          text-align: center;
          margin: 40px 180px;
          position: relative;
          display: none;
    }
    .d-alert{
        background-color: red;
        color: white;
        width: 500px;
        height: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: -520px 170px;
        display: none;
    }

</style>
<body>
    <main>
        <p class="title"> Login page </p>
        <div class="box">
            Eneter username : <br> <input type="text" class="inpuser" id="user" placeholder="enter username"> <br> <br>
            Eneter Password : <br> <input type="number" class="inpuser" id="pass" placeholder="enter Password">
            <br><br>
            <button id="btn"> submit </button>
        </div>
        <div class="loader">
            
        </div>
        <div class="alert">
            <p> Lorem ipsum dolor sit amet consectetur adipisicing elit. Distinctio dignissimos illum molestias ea vel omnis, illo impedit  a.</p>
        </div>
        <div class="d-alert">
            <h3> incorrect id or Password </h3>
        </div>
    </main>
    <script>
        let btn=document.getElementById('btn')
        btn.addEventListener('click',()=>{
            
        })
        
    </script>
    
</html>
