<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        main{
            margin: 0 auto;
            width: 500px;
            height: 700px;
            border: 2px solid black;
        }
        .rect{
            width: 20px;
            height: 450px;
            background-color: black;
            margin-left: 250px;
            margin-top: 150px;
        }
        .footer{
            background-color: black;
            width: 150px;
            height: 50px;
            margin-left: 180px;
            border-radius: 30px 30px 0px 0px;

        }
        .circle{
            border: solid rgb(222, 221, 221);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            margin-top: -650px;
            margin-left: 110px;
            

        }
        .gol{
            background-color: bisque;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-left: 240px;
            margin-top: -180px;
        }
        .wing1{
            transform: rotate(180deg);
            background-color: bisque;
            width: 40px;
            height: 130px;
            border-radius: 50%;
            transform: translate(240px);
        }
        .wing2{
            transform: translate(360px,-320px) rotate(90deg);
            background-color: bisque;
            width: 40px;
            height: 130px;
            border-radius: 50%;
            transform: translate(325px,-215px) rotate(-90deg);
            


        }
        .wing3{
            background-color: rgb(225, 196, 255);
            width: 40px;
            height: 130px;
            border-radius: 50%;
            transform: translate(155px,-345px) rotate(90deg);

        }
        .wing4{
            background-color: rgb(239, 83, 21);
            width: 40px;
            height: 130px;
            border-radius: 50%;
            transform: translate(240px, -560px);

        }
        main:hover .fan{
            animation: fan 1s linear infinite;
        }

        @keyframes fan{
            100%{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <main> 
        <div class="box">
            fan
        </div>
        <div class="rect">
            rect
        </div>
        <div class="footer">
            f
        </div>
        <div class="circle">
            c
        </div>
        <div class="gol">
            
        </div>
        <div class="fan">
            <div class="wing1">
                wing1
            </div>
            <div class="wing2">
                wing2
            </div>
            <div class="wing3">
                wing3
            </div>
            <div class="wing4">
                wing4
            </div>
        </div>
    </main>
</body>
</html>
