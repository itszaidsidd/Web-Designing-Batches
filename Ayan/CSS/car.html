<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        main{
            width: 90%;
            border: solid black;
            height: 532px;
            /* display: flex; */
            /* transform: translate(100px); */
            margin: 10px auto;
            border-bottom: 5px dashed darkgray;
        }
        .body{
            border: solid red;
            width: 250px;
            height: 100px;
            border-radius: 30px 30px 0px 0px;
            transform: translate(0px,300px);

        }
        .window{
            border: solid green;
            width: 30px;
            height: 30px;
            transform: translate(40px,200px);
        }
        .tire{
            border: 5px double black;
            background-color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            /* transform: translate(20px,263px); */
            position: relative;
            left: 150px;
            top: 250px;
        }
        .tire2{
            border: 5px double black;
            background-color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            /* transform: translate(170px,210px); 
            */
            position: relative;
            left: 30px;
            top: 190px;
        }


        .body2{
            border: solid red;
            width: 250px;
            height: 100px;
            border-radius: 30px 30px 0px 0px;
            transform: translate(0px,300px);

        }
        .window2{
            border: solid green;
            width: 30px;
            height: 30px;
            transform: translate(40px,200px);
        }
        .tire3{
            border: 5px double black;
            background-color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            /* transform: translate(20px,263px); */
            position: relative;
            top: 245px;
            left: 35px;
        }
        .tire4{
            border: 5px double black;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            /* transform: translate(170px,210px); 
            */
            background-color: white;
            position: relative;
            top:185px;
            left:160px;
        }
        .box2{
            transform: translate(270px,-250px);
        }
        .joint{
            border: solid brown;
            height: 5px;
            width: 17px;
            transform: translate(252px,-150px);
        }
        .car{
            animation: car 3s linear infinite alternate;
            
        }

        .t{
            border-color:balck gray;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: wheel 6s linear infinite;
        }

        @keyframes car{
        100%{
            transform: translate(800px);
        }
     }

     @keyframes wheel{
        50%{
            transform: rotate(1080deg);
        }
        100%{
            transform: rotate(0);
        }
     }
     h1{
        color: black;
        text-shadow: 5px 4px 10px red;
        text-align: center;
        background-color: red;
     }
     .car{
        /* background-color: green; */
     }
     .box1{
        transform: translate(0px,4px);
     }
    </style>
</head>
<body>
   <main>
    <h1> MY Train </h1>
    <div class="car">
        <div class="box1">

            <div class="body">
                
            </div>
            <div class="window">
                
            </div>
            <div class="tire t">o</div>
            <div class="tire2 t">o</div>
        </div>

        <div class="box2">
            <div class="body2">
                
            </div>
            <div class="window2">
                
            </div>
            <div class="tire3 t">o</div>
            <div class="tire4 t">o</div>
        </div>
        <div class="joint">
            
        </div>
        
    </div>
</main> 
</body>
</html>
