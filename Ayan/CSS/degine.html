<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        .logo{
            background-color: rgb(27, 152, 198);
            height: 50px;
        }
        .mid{
            display: flex;
            gap: 20px;
        }
        .left{
            background-color: rgb(193, 175, 175);
            width: 40%;
            height: 250px;
            position: relative;
            top: 50px;
            left: 130px;
            border-radius: 10%;

        }
        .left:hover{
            background-color: chartreuse;
            cursor: pointer;
        }
        .right:hover{
            background-color: brown;
        }
         .right{
            background-color: rgb(182, 182, 201);
            width: 40%;
            height: 250px;
            position: relative;
            top: 50px;
            left: 150px;
            border-radius: 10%;
        }
        .bar{
            background-color: khaki;
            width: 70%;
            /* height: 80px; */
            padding-top: 50px;
            padding-bottom: 50px;
            position: relative;
            top: 100px;
            margin: 0% auto;
            text-align: center;
            border-radius: 20px;
        }
        .footer{
            background-color: rgb(20, 18, 18);
            position: fixed;
            bottom: 0%;
            width: 100%;
            color: white;
            text-align: center;

        }
        
    </style>
</head>
<body>
    <main>
        <div class="logo">
            <ul>
                <tr>
                    <td> Item 1 </td>
                    <td> item 2</td>
                    <td> item 3</td>
                    <td> item 4</td>
                    <td> item 5</td>
                </tr>
            </ul>
        </div>
        <div class="mid">
            <div class="left">
                red
            </div>
            <div class="right">
                blue
            </div>
        </div>
        <div class="bar"> 
            Welcome to My website
        </div>
        <div class="footer">
            <h5> copyright@2026</h5>
        </div>
    </main>
</body>
</html>
