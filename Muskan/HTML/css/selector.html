<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

            height: 100px;

            border:2px solid black;

        }

    <div class="box box2">Box 2</div>
    <div class="box box3" id="b3">Box 3</div>

</html>
