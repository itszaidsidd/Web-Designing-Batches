<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            margin: 100px auto;
            width: 500px;
            text-align: center;
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <div class="box">
        <div id="count">1</div>
        <button id="btn">Click me</button>
    </div>
    <script>
        document.getElementById('btn').addEventListener('click',()=>{
            let x=document.getElementById('count');
            let n=parseInt(x.innerText);
            x.innerText=n+1
        })
    </script>
    
</body>
</html>
