<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-image:url("/images/n3.jpg");
            background-size: cover;
        }
        .form{
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 15px;
            background-color: rgba(0, 0, 0, 0.6);
            color:white;
            font-family: Arial, Helvetica, sans-serif;
        }
        form{
            display: flex;
            flex-direction: column;
            gap:15px;
        }
        input{
            padding: 5px;
            font-size:1.2em;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="form" id="form">
        <h1>Keyboard Events</h1>
        <form>
            <label for="t1">On Key up</label>
            <input type="text" id="t1" onkeyup="document.getElementById('form').style.background=this.value">
            <label for="t2">On Key down</label>
            <input type="text" id="t2" onkeydown="document.getElementById('form').style.backgroundColor=this.value">
            <label for="t3">On Key press</label>
            <input type="text" id="t3" onkeypress="alert(this.value)">
        </form>
    </div>
</body>
</html>
