<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 300px;
            height: 300px;
            background-color: green;
            margin: 150px auto;
        }
    </style>
</head>
<body>
    <div class="box" onmouseup="alert('Clicked')"></div>
</body>
</html>


<!-- Mouse Event
1. onclick                  left click
2. ondblclick               double click
3. oncontextmenu            right click
4. onmouseover              
5. onmouseout 
6. onmousedown
7. onmouseup
-->
