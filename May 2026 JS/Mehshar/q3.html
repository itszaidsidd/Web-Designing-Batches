<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Enter Name <input type="text" id="name"><br><br>
    <input type="radio" name="gen" id="m" checked> Male 
    <input type="radio" name="gen" id="f"> Female   <br><br>
    <button id="ok">OK</button>
    <script>
        let x=document.querySelector('#ok')
        x.addEventListener('click',()=>{
            let name=document.getElementById('name').value;
            let gm=document.getElementById('m').checked;
            if(gm==true){
                document.write("Hello Mr. ",name)
            }
            else{
                document.write("Hello Ms. ",name)
            }
        })
    </script>
</body>
</html>
