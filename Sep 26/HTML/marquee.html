<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <marquee>This is marquee tag</marquee>
    <marquee direction="right" bgcolor="red">This is marquee right direction</marquee>
    <marquee height="200px" direction="down" bgcolor="wheat">Marquee height</marquee>
    <marquee behavior="scroll">Marquee behavior scroll</marquee>
    <marquee behavior="slide">Marquee behavior slide</marquee>
    <marquee behavior="alternate">Marquee behavior alternate</marquee>
</body>
</html>
