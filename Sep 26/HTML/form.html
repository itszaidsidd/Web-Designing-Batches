<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        First name
        <input type="text" value="Enter first name">
        Last Name 
        <input type="text" placeholder="Enter last Name"><br><br>
        Email Id <input type="email" placeholder="Enter email id"> <br><br>
        Mobile no <input type="number">
        Phone no <input type="number"><br><br>
        Password <input type="text">
        Confirm Password <input type="password"><br><br>
        <h3>Select your gender</h3>
        <input type="radio" name="gen">Male
        <input type="radio" name="gen">Female <br><br>
        <h3>Select your languages</h3>
        <input type="checkbox" name="lang">Hindi
        <input type="checkbox" name="lang">English
        <input type="checkbox" name="lang">Urdu 
        <h3>Enter DOB</h3>
        <input type="date">
        <h3>Choose color</h3>
        <input type="color" name="" id="">
        <h3>Select your city</h3>
        <select>
            <option value="">Select</option>
            <option value="">Muzaffarnagar</option>
            <option value="">Saharanpur</option>
            <option value="">Meerut</option>
        </select>
        <h3>Upload Photo</h3>
        <input type="file" name="" id="">
        <br><br>
        <button>SUBMIT</button>
        <input type="submit">
    </form>
</body>
</html>
