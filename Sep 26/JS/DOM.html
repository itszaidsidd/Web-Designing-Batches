        header{

            padding: 20px;
            
        }

        <li>Accounting</li>
    </ul>
    <script>
        let title=document.getElementById('title')

        // console.log(title)
        // title.innerText='KZ Computer Center'
        sub_title.innerHTML='<h3>Cauching Center</h3>'
        title.textContent="KZ Computer Center"
        let h=document.getElementById('header')
        h.style.borderBottom='5px solid yellow'
    </script>
</body>
</html>
