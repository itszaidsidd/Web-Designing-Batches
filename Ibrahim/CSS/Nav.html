<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .nav{
            background-color: navy;
            color:white;
            display: flex;
            align-items: center;
            /* gap:40px; */
            justify-content: space-between;
            padding: 7px 60px;
        }
        .nav .logo{
            display: flex;
            gap:10px;
            align-items: end;
        }
        ul{
            display: flex;
            gap:30px;
        }
        ul li{
            list-style: none;
        }
        ul li:hover{
            font-weight: bold;
            color:red;
            cursor: pointer;
        }
        .hero{
            width: 100%;
            height: 92vh;
            background-color: lightblue;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap:5px;
            /* color:white; */
        }
        .btn{
            background-color: gray;
            color:white;
            padding: 5px 10px;
            font-size:17px;
            font-weight: bold;
            border-radius:7px;
        }
        .btn:hover{
            background-color: navy;
            cursor: pointer;
        }
        .abc{
            display: flex;
            background-color: red;
            color:white;
            font-weight: bold;
            justify-content: space-around;
            padding: 10px 0;
        }
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">
            <h1>Knowledge Zone</h1>
            <small>Learn and Implements</small>
        </div>
        <ul>
            <li>Home</li>
            <li>Courses</li>
            <li>Payment Status</li>
            <li>Login</li>
            <li>Sign up</li>
            <li>Feedback</li>
            <li>Contact</li>
        </ul>
    </div>
    <div class="hero">
        <h1>Welcome to Knowledge Zone</h1>
        <br>
        <small>Learn and Implements</small>
        <button class="btn">Get Started</button>
    </div>
    <div class="abc">
        <div>100+ Online Courses</div>
        <div>Expert Instructors</div>
        <div>Lifetime Access</div>
        <div>Money Back Guarnted</div>
    </div>
</body>
</html>
