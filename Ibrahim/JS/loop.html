<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Loop</h3>
    <script>
        // 1. while loop
        // 2. do-while loop
        // 3. for loop
        let i=10;
        while(i>=1){
            document.write(i+"<br>")
            i=i-1;
        }
    </script>
</body>
</html>
