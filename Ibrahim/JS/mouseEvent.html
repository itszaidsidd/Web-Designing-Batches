<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 400px;
            height: 400px;
            border:2px solid green;
            margin: 100px auto;
            background-color: aquamarine;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="box" onmouseout="alert('clicked')"></div>
</body>
</html>

<!-- Mouse Event -->
<!-- 
1. onclick -> left click
2. oncontextmenu -> right click
3. ondblclick -> double click
4. onmousedown  
5. onmouseup
6. onmouseover
7. onmouserout
-->
