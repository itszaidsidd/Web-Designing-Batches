<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            border: 5px solid green;
            margin: 10px;
        }
    </style>
</head>
<body>
    <script>
        let b1='Hello div1'
    </script>
    <div class="box" id="b1">b1</div>
    <div class="box" id="b2">Hello div 2</div>
    <div class="box" id="b3">Hello div 3</div>

    <script>
        setTimeout(()=>{
            document.getElementById('b1').innerText='Hiii'
        },1000)
        setTimeout(()=>{
            document.getElementById('b2').innerText='Hello'
        },2000)
        setTimeout(()=>{
            document.getElementById('b3').innerText='How are you'
        },3000)
    </script>
</body>
</html>
