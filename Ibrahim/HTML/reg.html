<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body bgcolor="pink" >
    <center>
        <h1>Student Registration Form</h1>
        <table  cellspacing="30px">
            <tr>
                <td>Roll no. :</td>
                <td><input type="number" placeholder="Enter Roll no"></td>
            </tr>
            <tr>
                <td>Studnet name :</td>
                <td>
                    <input type="text" placeholder="First Name"> - 
                    <input type="text" placeholder="Last Name">
                </td>
            </tr>
            <tr>
                <td>Date of Birth</td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td>Email id :</td>
                <td><input type="email" ></td>
            </tr>
            <tr>
                <td>Password :</td>
                <td><input type="password"> </td>
            </tr>
            <tr>
                <td>Gender :</td>
                <td>
                    <input type="radio" name="gen" checked> Male
                    <input type="radio" name="gen"> Female
                </td>
            </tr>
            <tr>
                <td>Department</td>
                <td>
                    <input type="checkbox"> CSE
                    <input type="checkbox"> IT
                    <input type="checkbox"> ECE
                    <input type="checkbox"> Civil
                    <input type="checkbox"> Mech
                </td>
            </tr>
            <tr>
                <td>Course :</td>
                <td>
                    <select>
                        <option value="">----Select Current Course's----</option>
                        <option value="BCA">BCA</option>
                        <option value="MCA">MCA</option>
                        <option value="B.Tech">B.Tech</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Studnet photo :</td>
                <td><input type="file"></td>
            </tr>
            <tr>
                <td>Address :</td>
                <td>
                    <textarea line="6"></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2"><button>Register</button></td>
            </tr>
        </table>
    </center>
</body>
</html>
