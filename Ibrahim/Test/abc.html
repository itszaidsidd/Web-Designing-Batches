<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        nav{
            display: flex;
            justify-content: space-around;
            background-color: navy;
            color:white;
            padding: 7px;
            align-items: center;
        }
        ul{
            display: flex;
            gap:40px;
        }
        ul li{
            list-style: none;
        }
        main{
            
            width: 100%;
            height: 90vh;
            background-color: lightblue;
            padding:030px;
        }
        main .boxes{
            display: flex;
            height: 90%;
            justify-content: space-between;
        }
        .box1,.box2{
            width: 48%;
            height: 60%;
            border:5px solid black;
        }
        .box1{
            background-color: red;

        }
        .box2{
            background-color: green;
        }
        .abc{
            width: 80%;
            margin: 10px auto;
            background-color: wheat;
            padding: 20px;
            border-radius: 30px;
        }
        footer{
            width: 100%;
            background-color: black;
            color:white;
            text-align: center;
            padding: 5px;
        }
    </style>
</head>
<body>
    <nav>
        <h2 class="logo">
            Knowledge Zone
        </h2>
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
            <li>Item 4</li>
        </ul>
    </nav>
    <main>
        <div class="boxes">

            <div class="box1">
                BOx 1
            </div>
            <div class="box2">Box 2</div>
        </div>
        <div class="abc">
            Welcome my website
        </div>
    </main>
    <footer>
        &copy; 2026 KZ || All Right Reserved
    </footer>
</body>
</html>
