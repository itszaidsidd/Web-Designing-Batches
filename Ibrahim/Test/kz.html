<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        nav{
            /* background-color: rgba(0, 0, 128, 0.381); */
            color:white;
            display: flex;
            gap:60px;
            padding: 7px 30px;
            align-items: center;
            position: fixed;
            top:0;
            width: 100%;
            z-index: 10;
        }
        nav .logo{
            display: flex;
            align-items: end;
            gap:5px;
        }
        nav ul{
            display: flex;
            gap:30px;
        }
        nav ul li{
            list-style: none;
            font-weight: bold;
        }
        .vid{
            width: 100%;
            height: 100vh;
            /* background-color: red; */
            /* border:2px solid black; */
            overflow: hidden;
        }
        .vid video{
            width: 100%;
            /* opacity: .5; */
        }
        .vid-overly{
            width: 100%;
            height: 100%;
            background-color: rgb(7, 118, 152);
            /* background-color: brown; */
            opacity: .5;
            position: absolute;
            top:0;
            left:0;
        }
        .vid-content{
            width: 100%;
            height: 100%;
            /* background-color: brown; */
            position: absolute;
            top:0;
            left:0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color:white;
        }
        .btn{
            background-color: red;
            color:white;
            padding: 5px 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <h1>Knowledge Zone</h1>
            <small>Learn and Implemetns</small>
        </div>
        <ul>
            <li>Item1</li>
            <li>Item2</li>
            <li>Item3</li>
            <li>Item4</li>
            <li>Item5</li>
            <li>Item6</li>
            <li>Item7</li>
            <li>Item8</li>
        </ul>
    </nav>
    <div class="vid">
        <video autoplay loop muted>
            <source src="video/video2.mp4">
        </video>
        <div class="vid-overly"></div>
        <div class="vid-content">
            <h1>Welcome to Knowledge Zone</h1><br>
            <small>Learn and Implements</small>
            <button class="btn">Get Started</button>
        </div>
    </div>
</body>
</html>
