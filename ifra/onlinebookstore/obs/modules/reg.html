<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;

        }
        form{
            background-color: rgba(0,0,0,0.5);
            width: 600px;
            border-radius: 20px;
            margin: 20px auto;
            padding: 20px;
            color:white;
        }
        input{
            width: 100%;
            padding: 6px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <form action="">
        <table cellspacing="20px">
            <tr>
                <td>Registration No</td>
                <td><input type="text"></td>
                <td>Name</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Email Id</td>
                <td colspan="3"><input type="text"></td>
            </tr>
            <tr>
                <td>Phone</td>
                <td><input type="text"></td>
                <td>Password</td>
                <td><input type="text"></td>
            </tr>
        </table>
    </form>
</body>
</html>
