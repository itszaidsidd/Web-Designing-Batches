
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>password Management system</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(120deg, rgb(235, 106, 37), rgb(242, 240, 240));
      font-family: 'Poppins', sans-serif;
    }

    .login-box {
      width: 390px;
      height:540px;
      background: white;
      border-radius: 25px;
      padding: 35px;
      text-align: center;
      box-shadow: 
        0 10px 15px rgba(0, 0, 0, 0.3),
        0 20px 30px rgba(0, 0, 0, 0.2);
      transition: 0.3s;
    }

    .login-box:hover {
      transform: translateY(-10px);
      box-shadow: 
        0 15px 25px rgba(0, 0, 0, 0.35),
        0 25px 40px rgba(0, 0, 0, 0.25);
    }

    img {
      height: 120px;
      width: 120px;
      border-radius: 50%;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 600;
      text-transform: capitalize;
    }

    .input-box {
      position: relative;
      margin-bottom: 15px;
    }

    .input-box input {
      width: 100%;
      padding: 16px 45px 14px 15px;
      border-radius: 8px;
      border: 1px solid rgb(27, 26, 26);
      font-size: 16px;
    }

    .input-box i {
      position: absolute;
      right: 15px;
      top: 40%;
      transform: translateY(-50%);
      font-size: 20px;
      color: rgb(14, 0, 0);
      cursor: pointer;
    }

    .login {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(120deg, rgb(235, 106, 37), rgb(242, 240, 240));
      color: white;
      font-weight: bolder;
      font-size: 20px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow:
        0 10px 15px rgba(0, 0, 0, 0.3),
        0 20px 30px rgba(0, 0, 0, 0.2);
    }

    .login:active {
      transform: translateY(3px);
      box-shadow: 0 5px 10px rgba(0,0,0,0.3);
    }

    p {
      margin-top: 15px;
      font-size: 18px;
    }

    p font {
      color: rgb(3, 52, 174);
      cursor: pointer;
    }
      .teddy1{
      position:relative;
      left:0px;
    }

    .teddy2{
      position:relative;
      left:89px;
      display:none;
    }
    .teddy3{
       position:relative;
      left:90px;
      display:none;
    }
  </style>
</head>
<body>
  <div class="login-box">
 <img id="teddy1" class="teddy1" src="images/1.png">
<img  id="teddy2" class="teddy2" src="images/3.png" alt="">
<img  id="teddy3" class="teddy3" src="images/2.png" alt="">
    <h2>Login Management System</h2><br>
    <div class="input-box">
      <input type="text" placeholder="Username / Email" required><br><br>
      <i class="fa-solid fa-user"></i>
    </div>
    <div class="input-box">
      <input id="pass" type="password" placeholder="Password" required><br>
      <i id="icon" class="fa-solid fa-lock"></i>
    </div>
    <button class="login" id="login">Login</button><br><br>
    <p>Forget Password? <font>Click Here</font></p>
  </div>
  <script>
    const pass = document.getElementById("pass");
    const icon= document.getElementById("icon");
    let login=document.getElementById("login");
     let teddy1=document.getElementById("teddy1");
      let teddy2=document.getElementById("teddy2");
       let teddy3=document.getElementById("teddy3");

    pass.addEventListener('click',()=>{
      teddy3.style.display = "block"; 
        teddy1.style.display = "none"; 
    })
    icon.addEventListener("click", () => {
      // teddy1.src='images/2.png';
      if (pass.type === "password") {
        pass.type = "text";
        icon.classList.remove("fa-lock");
        icon.classList.add("fa-lock-open");
         teddy1.style.display = "none";
    teddy2.style.display = "block"; 
        teddy3.style.display = "none"; 

      }
       else {
        pass.type = "password";
        icon.classList.remove("fa-lock-open");
        icon.classList.add("fa-lock");
         teddy3.style.display = "block";  
    teddy2.style.display = "none";  
    
  }

    });
    login.addEventListener("click", () => {
      window.open("loading.html", "_blank");
    });
  </script>
</body>
</html>
