<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="count">0</div>
    <button id="btn">Click here</button>
    <script>
        document.querySelector('#btn').addEventListener('click',()=>{
            let num=parseInt(document.querySelector('#count').innerHTML)
            document.querySelector('#count').innerHTML=num+1;
        })
    </script>
</body>
</html>
