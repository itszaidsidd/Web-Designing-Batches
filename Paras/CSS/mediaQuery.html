<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* body{
            background-color: blue;
        } */

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        nav{
            width: 100%;
            background-color: darkblue;
            color:white;
            font-size: 1.2rem;
            padding: 10px 30px;
        }
        nav ul{
            display: flex;
            justify-content: space-around;
        }
        nav ul li{
            list-style: none;
        }
        li:hover{
            color:red;
            cursor: pointer;
        }

        @media screen and (max-width:834px ) {
            /* body{
                background-color: red;
            } */
        }

        @media screen and (max-width:480px)  {
            /* body{
                background-color: green;
            } */

            nav ul{
            margin-top: 80px;
             flex-direction: column;
             gap:20px;
             align-items: center;   
            }
            
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About us</li>
            <li>Skills</li>
            <li>Project</li>
            <li>Contact</li>
            <li>Experience</li>
        </ul>
    </nav>
</body>
</html>
