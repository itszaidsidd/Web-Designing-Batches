<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .nav{
            background-color: navy;
            color:white;
            display: flex;
            gap:30px;
            align-items: center;
            padding: 5px 50px;
        }
        .nav .logo{
            display: flex;
            align-items: end;
            gap:10px;
        }
        .nav ul{
            display: flex;
            gap:30px;
        }
        .nav ul li{
            list-style: none;
            border-bottom: 2px solid transparent;
        }
        .nav ul li:hover{
            color:yellow;
            cursor: pointer;
            border-bottom: 2px solid white;
            /* font-weight: bold; */
        }
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">
            <h1>Knowledge Zone</h1>
            <small>Learn and Implements</small>
        </div>
        <ul>
            <li>Home</li>
            <li>Courses</li>
            <li>Payment Status</li>
            <li>Login</li>
            <li>Sign up</li>
            <li>Feedback</li>
            <li>Contact</li>
        </ul>
    </div>
    <img src="https://msuniversity.ac.in/assets/images/logo.png" alt="">
</body>
</html>
