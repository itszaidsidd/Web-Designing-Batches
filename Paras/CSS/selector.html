<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            border:5px solid black;
            background-color: red;
            margin: 10px;
            color:white;
        }
        .b2{
            background-color: green;
        }
        #abc{
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="box b1">Div 1</div>
    <div class="box b2">Div 2</div>
    <div class="box b3" id="abc">Div 3</div>
</body>
</html>

<!-- 
Selector
                    index.html              style.css
1. By Tag Name      <div>                   div{ }
2. By Class Name    <div class="box">       .box{ }
                    <div class="box b1">
3. By Id name       <div id="abc">          #abc{ }
-->
