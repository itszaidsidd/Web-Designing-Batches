        ondblclick -> double click

     <div class="form" id="form">
        <h1>Keyboard Events</h1>
        <form>
            <label for="t1">On key down</label>
            <!-- <input type="text" onkeydown="alert(this.value)" id=t1> -->
            <input type="text" onkeydown="document.getElementById('form').style.background=this.value" id=t1>
            <label for="t2">On key up</label>
            <!-- <input type="text" id="t2" onkeyup="alert(this.value)"> -->
            <input type="text" id="t2" onkeyup="document.getElementById('form').style.backgroundColor=this.value">
            <label for="t3">On key press</label>
            <input type="text" id="t3" onkeypress="alert(this.value)">
        </form>
     </div>
