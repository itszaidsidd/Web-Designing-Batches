<head>

<body>
    Enter length <input type="number" id="l"><br><br>
    Enter Breadht <input type="number" id="b"><br><br>
    <button id="btn">OK</button>
    <hr>
    <script>
        let btn=document.querySelector('#btn')
        btn.addEventListener('click',()=>{
            let l=document.querySelector('#l').value;
            let b=document.querySelector('#b').value;
            let ar=l*b;
            let p=2*(l+b);
            document.write('Area of ractangle : ',ar);
            document.write('<br>Parameter of Ractangle : ',p);
        })
    </script>
