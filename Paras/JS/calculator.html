<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: black;
            font-family: Arial, Helvetica, sans-serif;
            background: #2b2b2b;
            cursor: pointer;
        }

        .calculator {
            width: 384px;
            height: 575px;
            border-radius: 20px;
            margin: 90px auto;
            padding: 20px;
            cursor: pointer;
            background: #2b2b2b;
            border: 2px solid grey;
            box-shadow: 2px 2px 10px grey, 2px 2px 10px grey;

        }

        .calculator-btn {
            margin: 16px;
        }

        button {
            border: none;
            width: 60px;
            height: 60px;
            margin: 10px;
            border-radius: 50%;
            background: transparent;
            box-shadow: -8px -8px 15px grey;
            color: white;
            font-weight: bolder;
            font-size: 30px;
            cursor: pointer;

        }

        input {
            border: none;
            height: 136px;
            width: 362px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            background: transparent;
            text-align: right;

        }

        input::placeholder {
            color: white;
        }

        .btn8 {
            background-color: rgb(247, 109, 59);
        }

        .btn1,
        .btn2,
        .btn3,
        .btn4,
        .btn6,
        .btn7,
        .btn5 {
            font-size: 20px;
            color: green;
        }
        
    </style>
</head>

<body>
    <div class="calculator" id="xyz">
        <input type="text" name="" id="text" value="" placeholder="0">
        <div class="calculator-btn">
            <button onclick="input_data('AC')" class="btn1">AC</button>
            <button onclick="input_data('DEL')" class="btn2">DEL</button>
            <button onclick="input_data('%')" class="btn3">%</button>
            <button onclick="input_data('/')" class="btn4">/</button>
            <div>
                <button onclick="input_data('7')">7</button>
                <button onclick="input_data('8')">8</button>
                <button onclick="input_data('9')">9</button>
                <button onclick="input_data('*')" class="btn5">*</button>
            </div>
            <div>
                <button onclick="input_data('4')">4</button>
                <button onclick="input_data('5')">5</button>
                <button onclick="input_data('6')">6</button>
                <button onclick="input_data('-')" class="btn6">-</button>
            </div>
            <div>
                <button onclick="input_data('1')">1</button>
                <button onclick="input_data('2')">2</button>
                <button onclick="input_data('3')">3</button>
                <button onclick="input_data('+')" class="btn7">+</button>
            </div>
            <div>

                <button onclick="input_data('00')">00</button>
                <button onclick="input_data('0')">0</button>
                <button onclick="input_data('.')">.</button>
                <button onclick="input_data('=')" class="btn8">=</button>


            </div>
        </div>
        <script>
            let eq = document.getElementById('text');
            function input_data(n) {
                if (n == 'AC') {
                    eq.value = '';
                }
                else if(n=='DEL'){
                    let s=eq.value;
                    s=s.slice(0,-1);
                    eq.value=s; 
                }
                else if(n=='='){
                    let s=eq.value;   
                    let result=eval(s); 
                    eq.value=result;
                }
                else if(n=='+' || n=='-' || n=='*' || n=='/' || n=='%'){
                    let s=eq.value;
                    let c=s.slice(-1);
                    if(c=='+' || c=='-' || c=='*' || c=='/' || c=='%'){
                        s=s.slice(0,-1);
                    }
                    s=s+n;
                    eq.value=s;
                }
                else {
                    let s = eq.value; 
                    s = s + n;  
                    eq.value = s;
                }

            }
        </script>
</body>

</html>
