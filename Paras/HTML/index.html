<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- <img src="images/n1.jpg" width="500px" height="400px" border="5px"> -->
    <!-- Order List <ol></ol>
    Unorder List <ul></ul>
    List Item    <li></li> -->
    <ol start="11">
        <li>Apple</li>
        <li>Pine Apple</li>
        <li>Wood Apple</li>
    </ol>
    <ul type="circle">
        <li>Red</li>
        <li>Green</li>
        <li>Blue</li>
    </ul>
    <!-- Nested List -->
    <ol>
        <li>Fruits</li>
        <ul>
            <li>Apple</li>
            <li>Banana</li>
            <li>Mango</li>
        </ul>
        <li>Colors </li>
        <ol>
            <li>Red</li>
            <li>Green</li>
            <li>Blue</li>
        </ol>
    </ol>

    <!-- Formated Text -->
     <b>Bold</b><br>
     <u>Underline</u><br>
     <i>Italic</i><br>
     <s>Strike</s><br>
     H<sub>2</sub>O<br>
     e<sup>x</sup><br>
     <mark>Highlight</mark><br>
     <font color="red" size="8" face="jokerman">This is use to change the color font and size</font>
     <!-- font
      1. Face    for font Family
      2. Colors  for text Colors
      3. size    for font size -->
</body>

</html>
