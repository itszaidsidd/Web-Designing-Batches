<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Registration Form</h2>
    <form>
        First Name <input type="text" placeholder="Enter your text" required>
        Last Name <input type="text" placeholder="Enter last name"><br><br>
        Email <input type="email" placeholder="Enter your email"><br><br>
        Password <input type="password">
        Confirm Password <input type="password"><br><br>
        Phone No <input type="number">
        <h3>Select your DOB</h3>
        <input type="date">
        <h3>Select your Gender</h3>
        Male <input type="radio" name="gen" checked>
        Female <input type="radio" name="gen">
        <h3>Select your languages</h3>
        <input type="checkbox" name="lang">Hindi
        <input type="checkbox" name="lang">English 
        <input type="checkbox" name="lang">Urdu
        <h3>Select your State</h3>
        <select>
            <option value="select">Select</option>
            <option >Uttar Pradesh</option>
            <option >Delhi</option>
            <option >Punjab</option>
        </select>
        <h3>Enter your idea</h3>
        <textarea></textarea><br><br>
        <input type="submit" value="Submit">
        <button>Button</button>
    </form>
</body>
</html>
