<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 90vw;
            height: 90vh;
            border:5px solid black;
            padding: 10px;
            display: flex;
            /* flex-direction: column; */
            /* flex-direction: column-reverse; */
            /* justify-content: space-between; */
            justify-content: center;
            align-items:center;
            gap:10px;
        }
        .box{
            width: 100px;
            height: 100px;
            background-color: rgb(100, 100, 252);
            border:2px solid rgb(2, 2, 98);
            color:white;
            font-size:2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
    </div>
</body>
</html>
