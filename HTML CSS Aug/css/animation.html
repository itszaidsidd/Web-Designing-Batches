<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 80vw;
            height: 80vh;
            border:10px solid blue;
            background-color: rgb(232, 246, 251);
        }
        .box{
            width: 100px;
            height: 100px;
            border:5px solid red;
            background-color: green;
            color:white;
            animation: anim 2s ease-in 1s infinite;   
        }
        @keyframes anim{
            0%{
                transform: translateX(0) translateY(0);
            }
            25%{
                transform: translateX(500px) translateY(0);
            }
            50%{
                transform: translateX(500px) translateY(450px);
            }
            75%{
                transform: translateX(0) translateY(450px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Box</div>
    </div>
</body>
</html>
