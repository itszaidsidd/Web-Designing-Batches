    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            .container{
                width: 100%;
                height: 100vh;
                background-color: bisque;
                display: flex;
                /* flex-direction: column; */
                justify-content:center;
                /* flex-wrap: wrap; */
                align-items:center;
                gap:30px;
            }
            .box{
                width: 50px;
                height: 50px;
                background-color:aqua;
                border: 2px solid blue;
                border-radius: 10px;
                padding: 15px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
            <div class="box">7</div>
            <div class="box">8</div>
            
        </div>
    </body>
    </html>
