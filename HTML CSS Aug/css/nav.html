<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .nav {
            /* background-color: lightblue; */
            background-color: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 20px;
            color: white;
        }

        ul {
            display: flex;
        }

        ul li {
            list-style: none;
            margin-left: 30px;
        }

        .logo {
            /* margin-left: 20px; */
            display: flex;
            align-items: end;
        }

        .main {
            /* background-color: red; */
            background-image: url("../images/n5.jpg");
            background-size: cover;
            width: 100%;
            height: 100vh;
        }
        .container{
            /* background-color: red; */
            width: 100%;
            height: 93vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color:white;
        }
        .container button{
            padding: 7px 15px;
            border-radius: 5px;
            /* font-size:20px; */
            background-color: blue;
            color:white;
        }
    </style>
</head>

<body>

    <div class="main">
        <div class="nav">
            <div class="logo">
                <h1>Knowledge Zone</h1>
                <small>Learn and Implements</small>
            </div>

            <ul>
                <li>Home</li>
                <li>Course</li>
                <li>Payment Status</li>
                <li>Login</li>
                <li>Sign-up</li>
                <li>Feedback</li>
                <li>Contact</li>
            </ul>
        </div>
        <div class="container">
            <h1>Welcome to Knowledge Zone</h1><br>
            <h4>Learn and Implements</h4>
            <button>Get Started</button>
        </div>
    </div>
</body>

</html>
