<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            margin: 20px auto;
            width: 90vw;
            height: 90vh;
            background-color: aquamarine;
            border:2px solid black;
            display: flex ;
            /* flex-direction: column; */
            justify-content: center;
            align-items: center;
            /* flex-wrap: wrap; */
            gap:20px;
        }
        .box{
            width: 50px;
            height: 50px;
            font-size:20px;
            background-color: rgb(30, 186, 239);
            border:1px solid blue;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
  
    </div>
</body>
</html>
