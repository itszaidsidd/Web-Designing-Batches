<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-image: url('../images/n3.jpg');
            background-size: cover;
        }
        .form{
            width: 350px;
            background-color: rgba(0,0,0,0.5);
            border-radius: 25px;
            margin: 100px auto;
            padding: 20px;
            color:white;
            display: flex;
            flex-direction: column;
            gap:12px;
            font-size: 1.2em;
        }
        input[type=text]{
            font-size: 1.1em;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="form" id="form">
        <h1>Java Script Keyoard Event</h1>
        <label for="">On Key Up</label>
        <input type="text" name="" id="" onkeyup="document.getElementById('form').style.background=this.value">
        <label for="">On Key Down</label>
        <input type="text" name="" id="" onkeydown="document.getElementById('form').style.background=this.value">
        <label for="">On Key press</label>
        <input type="text" name="" id="" onkeypress="alert(this.value)">
    </div>
</body>
</html>
